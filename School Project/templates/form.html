{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:700px"><div class="card-body">
  <h3 class="mb-3">{{ title }}</h3>
  <form method="post" novalidate>{% csrf_token %}
    {% for f in form %}
    <div class="mb-3"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>
    {% endfor %}
    {{ form.non_field_errors }}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="javascript:history.back()">Cancel</a>
  </form>
</div></div>
{% endblock %}
