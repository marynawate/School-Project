{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:600px"><div class="card-body">
  <h3>Delete</h3>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-link" href="javascript:history.back()">Cancel</a>
  </form>
</div></div>
{% endblock %}
