{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:520px"><div class="card-body">
  <h3 class="mb-3">Student sign up</h3>
  <form method="post" novalidate>{% csrf_token %}
    {% for f in form %}
    <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{{ f.errors }}
      {% if f.help_text %}<div class="form-text">{{ f.help_text|safe }}</div>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Create account</button>
  </form>
</div></div>
{% endblock %}
