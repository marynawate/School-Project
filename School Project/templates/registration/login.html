{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto" style="max-width:420px"><div class="card-body">
  <h3 class="mb-3">Log in</h3>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}</div>{% endfor %}
    {{ form.non_field_errors }}
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 text-center">New student? <a href="{% url 'signup' %}">Create an account</a></p>
</div></div>
<script>document.querySelectorAll('form input').forEach(i=>{if(i.type!=='hidden')i.classList.add('form-control')})</script>
{% endblock %}
